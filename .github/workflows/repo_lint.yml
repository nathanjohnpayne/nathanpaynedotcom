name: repo-lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: make_ci_scripts_executable
        run: chmod +x scripts/ci/*

      - name: check_required_root_files
        run: ./scripts/ci/check_required_root_files

      - name: check_no_tool_folder_instructions
        run: ./scripts/ci/check_no_tool_folder_instructions

      - name: check_no_forbidden_top_level_dirs
        run: ./scripts/ci/check_no_forbidden_top_level_dirs

      - name: check_dist_not_modified
        run: ./scripts/ci/check_dist_not_modified

      - name: check_spec_test_alignment
        run: ./scripts/ci/check_spec_test_alignment

      - name: check_duplicate_docs
        run: ./scripts/ci/check_duplicate_docs

      - name: check_review_policy_exists
        run: |
          MISSING=0
          if [ ! -f ".github/review-policy.yml" ]; then
            echo "ERROR: .github/review-policy.yml is missing"
            MISSING=1
          fi
          if [ ! -f "REVIEW_POLICY.md" ]; then
            echo "ERROR: REVIEW_POLICY.md is missing"
            MISSING=1
          fi
          exit $MISSING

      - name: check_codex_scripts
        run: ./scripts/ci/check_codex_scripts

      - name: check_workflow_parsers
        run: ./scripts/ci/check_workflow_parsers

      - name: check_governance_files
        run: |
          MISSING=0
          for file in SECURITY.md .github/CODEOWNERS .github/dependabot.yml; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing"
              MISSING=1
            fi
          done
          exit $MISSING

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # `npm run lint` (eslint) had never run in CI — the job above only
      # executes the scripts/ci/* structure checks. eslint errors, such as
      # the preserve-caught-error break repaired in #519, therefore stayed
      # latent until someone ran lint locally with lockfile-exact deps.
      # This job closes that gap.
      - name: install_dependencies
        # package-lock.json is gitignored, so `npm ci` is unavailable;
        # install straight from package.json.
        #   --no-save        leave package.json untouched
        #   --ignore-scripts the eslint toolchain needs no lifecycle hooks,
        #                    and this skips the credentialed prebuild
        #                    image-refresh scripts
        # NOTE: unlike the ad-hoc js-yaml installs in agent-review.yml /
        # pr-audit.yml, this step deliberately omits --legacy-peer-deps.
        # `typescript` is a PEER dependency of typescript-eslint (and of
        # astro's tsconfck), not a direct dependency; --legacy-peer-deps
        # would skip it and `eslint .` would then fail with
        # "Cannot find module 'typescript'" on the .astro / .ts sources.
        run: npm install --no-save --ignore-scripts

      - name: eslint
        run: npm run lint
