# .coderabbit.yml — CodeRabbit configuration
# See https://docs.coderabbit.ai/configuration

language: en-US

tone_instructions: >-
  Focus on bugs, security issues, and correctness over style nitpicks.
  Keep comments actionable and concise.

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  profile: assertive
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  poem: false

  related_issues: true
  related_prs: true
  assess_linked_issues: true
  estimate_code_review_effort: true

  path_instructions:
    - path: "src/pages/**"
      instructions: >-
        Astro pages. Check for proper use of Astro component syntax,
        SEO meta tags (title, description, og:image), and that pages
        render correctly in both static and server modes.
    - path: "src/content/**"
      instructions: >-
        Blog and content collection files. Verify frontmatter schema
        is complete (title, date, description) and that any linked
        assets exist.
    - path: "src/styles/**"
      instructions: >-
        Global styles. Flag accessibility issues — contrast ratios,
        focus indicators, and responsive breakpoints.
    - path: "src/layouts/**"
      instructions: >-
        Layout components shared across pages. Verify semantic HTML
        structure (header, main, footer, nav) and accessibility
        landmarks.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
