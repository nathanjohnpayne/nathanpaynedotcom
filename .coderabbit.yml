# .coderabbit.yml — CodeRabbit configuration
# See https://docs.coderabbit.ai/configuration

language: en-US

tone_instructions: >-
  Focus on bugs, security issues, and correctness over style nitpicks.
  Keep comments actionable and concise.

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  profile: assertive
  request_changes_workflow: false

  # CodeRabbit's hosted ESLint sandbox runs only curated plugins and does
  # not install local deps, so it can't resolve the TypeScript frontmatter
  # parser for .astro files and emits "Parsing error: Unexpected token :"
  # on every PR touching an .astro component. Our eslint.config.js is
  # correct (passes `npm run lint` locally); disable the redundant, broken
  # CodeRabbit ESLint tool. See #426.
  tools:
    eslint:
      enabled: false

  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  poem: false

  related_issues: true
  related_prs: true
  assess_linked_issues: true
  estimate_code_review_effort: true

  path_instructions:
    - path: "src/pages/**"
      instructions: >-
        Astro pages. Check for proper use of Astro component syntax,
        SEO meta tags (title, description, og:image), and that pages
        render correctly in both static and server modes.
    - path: "src/content/blog/**"
      instructions: >-
        Blog post markdown. Verify frontmatter schema is complete
        (title, date, description) and that any linked assets exist.
    - path: "src/content/**"
      instructions: >-
        Astro content collections. Validate each file against its own
        collection's Zod schema in src/content.config.ts — the schemas
        differ per collection (e.g. projects requires title +
        description; certifications requires name/issuer/year; skills
        requires label/priority/skills). The resume and structured-data
        active collections—experience, education, certifications,
        skills, myself, resume/projects, bio—intentionally do NOT use
        the blog title/date/description triad, instead carrying
        domain-specific frontmatter (company, issuer, degree, year,
        tech, order, etc.); do not flag those three fields as missing on
        them. `src/content/awards/**` is a dormant, unregistered scaffold
        while empty; the collection and resume-page wiring must return
        with its first real entry. The title/date/description requirement
        applies only to src/content/blog/**. Always verify frontmatter
        matches the relevant collection schema and that any linked assets
        exist.
    - path: "src/styles/**"
      instructions: >-
        Global styles. Flag accessibility issues — contrast ratios,
        focus indicators, and responsive breakpoints.
    - path: "src/layouts/**"
      instructions: >-
        Layout components shared across pages. Verify semantic HTML
        structure (header, main, footer, nav) and accessibility
        landmarks.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
