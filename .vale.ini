StylesPath = styles
MinAlertLevel = warning

[*.{md,mdx,yaml,yml}]
BasedOnStyles = CMOS

[*.{md,mdx,yaml,yml}]
TokenIgnores = (\[[A-Z][A-Z]+[A-Z0-9_-]*-\d+[\s\x{00A0}\p{Zs}]+—[\s\x{00A0}\p{Zs}]+),((?:npm|pnpm|yarn) run [A-Za-z0-9:_-]+),(--[A-Za-z][A-Za-z0-9_-]*),(\.[A-Za-z][A-Za-z0-9._-]*),([A-Za-z0-9_-]+\.(?:astro|css|html|ini|js|json|md|mdx|mjs|sh|ts|tsx|yaml|yml))
